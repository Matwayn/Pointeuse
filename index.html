<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Pointeuse</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pointeuse">
  <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#eceef1; --surface:#ffffff; --ink:#16191d; --muted:#626a74; --line:#d5d9df; --soft:#f3f4f6;
      --go:#1e9e5a; --stop:#d6453d; --pause:#e08a1e;
      --tungsten:255,190,92;            /* faisceau pendant le travail */
      --beam:var(--tungsten); --beam-a:.0;
      --ease:cubic-bezier(.2,.7,.2,1);
      --font:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101317; --surface:#181c21; --ink:#e9ecef; --muted:#97a0aa; --line:#2c3238; --soft:#20252b; }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    [hidden] { display:none !important; }
    html { background:var(--bg); }
    body { margin:0; font-family:var(--font); font-size:16px; line-height:1.4; color:var(--ink); background:var(--bg);
           display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
           padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
    .card { width:100%; max-width:420px; background:var(--surface); border-radius:24px; padding:18px 18px 20px;
            box-shadow:0 1px 0 var(--line), 0 18px 40px -24px rgba(20,25,30,.35); }
    button, input { font-family:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:2px solid rgb(var(--tungsten)); outline-offset:2px; }

    /* ---------- En-tête ---------- */
    .top { display:flex; align-items:center; gap:10px; min-height:32px; }
    .brand { font-weight:700; font-stretch:110%; font-size:17px; letter-spacing:-.01em; margin:0; }
    .sync { margin-left:auto; font-size:12px; color:var(--muted); opacity:0; transition:opacity .3s; }
    .sync.on { opacity:1; }
    .icon { width:34px; height:34px; border-radius:50%; border:0; background:var(--soft); color:var(--muted);
            display:grid; place-items:center; transition:background .2s; }
    .icon:hover { background:var(--line); }

    /* ---------- Chargement (squelette) ---------- */
    .skel { display:grid; gap:14px; padding-top:18px; transition:opacity .35s var(--ease); }
    .sk { border-radius:12px; background:linear-gradient(90deg, var(--soft) 0%, var(--line) 50%, var(--soft) 100%);
          background-size:250% 100%; animation:shimmer 1.3s linear infinite; }
    .sk-status { height:14px; width:46%; margin:0 auto; border-radius:7px; }
    .sk-timer  { height:76px; width:78%; margin:4px auto 6px; border-radius:16px; }
    .sk-input  { height:46px; }
    .sk-chips  { height:28px; width:70%; border-radius:14px; }
    .sk-btns   { height:60px; border-radius:16px; }
    .sk-strip  { height:58px; }
    .skel-msg  { text-align:center; font-size:14px; color:var(--stop); min-height:0; }
    @keyframes shimmer { from { background-position:100% 0; } to { background-position:-150% 0; } }
    .app { opacity:0; transform:translateY(6px); transition:opacity .45s var(--ease), transform .45s var(--ease); }
    .card.ready .app { opacity:1; transform:none; }
    .card.ready .skel { opacity:0; pointer-events:none; }

    /* ---------- Scène : chrono OU jour non travaillé (même emplacement, fondu enchaîné) ---------- */
    .stage { display:grid; margin:10px 0 14px; }
    .stage > * { grid-area:1/1; transition:opacity .4s var(--ease), transform .4s var(--ease), visibility 0s linear .4s; }
    .stage > .off { opacity:0; transform:scale(.97); visibility:hidden; pointer-events:none; }
    .stage > .shown { transition-delay:0s; }
    .clock { position:relative; text-align:center; padding:22px 0 18px; isolation:isolate; }
    .clock::before { content:''; position:absolute; inset:-6px 8% 0; z-index:-1; border-radius:50%;
                     background:radial-gradient(closest-side, rgba(var(--beam), var(--beam-a)), rgba(var(--beam), 0));
                     transition:background .6s var(--ease); }
    .card[data-state="working"] { --beam-a:.55; }
    .card[data-state="paused"]  { --beam:224,138,30; --beam-a:.22; }
    .status { font-size:14px; color:var(--muted); min-height:20px; }
    .timer { font-weight:650; font-stretch:112%; font-size:clamp(52px, 17vw, 66px); line-height:1.05; letter-spacing:-.02em;
             font-variant-numeric:tabular-nums; margin-top:4px; transition:color .4s; }
    .card[data-state="idle"] .timer { color:var(--muted); }
    .card[data-state="paused"] .timer { color:var(--pause); animation:dim 2.4s ease-in-out infinite; }
    @keyframes dim { 50% { opacity:.55; } }

    .dayoff { text-align:center; padding:18px 12px 16px; border-radius:20px; background:var(--gel, #d9d9d9); color:var(--gel-ink, #2f3337);
              transition:background .4s, opacity .4s var(--ease), transform .4s var(--ease); }
    .dayoff .emo { font-size:44px; line-height:1; }
    .dayoff h2 { margin:8px 0 2px; font-size:30px; font-weight:700; font-stretch:112%; letter-spacing:-.015em; }
    .dayoff p { margin:0; font-size:15px; opacity:.8; }
    .dayoff .work { margin-top:14px; border:1px solid currentColor; background:transparent; color:inherit; border-radius:999px;
                    padding:9px 16px; font-size:14px; font-weight:600; opacity:.85; }
    .dayoff .work:disabled { opacity:.4; }

    /* ---------- Lieu ---------- */
    .collapse { display:grid; grid-template-rows:1fr; transition:grid-template-rows .4s var(--ease), opacity .3s; }
    .collapse > .inner { overflow:hidden; min-height:0; }
    .collapse.closed { grid-template-rows:0fr; opacity:0; }
    label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
    input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
            color:var(--ink); font-size:16px; transition:border-color .2s; }
    input:focus { border-color:rgb(var(--tungsten)); outline:none; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 14px; min-height:6px; }
    .chip { border:0; background:var(--soft); color:var(--ink); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:500;
            animation:pop .25s var(--ease) both; }
    .chip small { color:var(--muted); margin-left:4px; }

    /* ---------- Boutons principaux ---------- */
    .btns { display:flex; gap:10px; }
    .btns button { flex:1; border:0; border-radius:16px; padding:19px 10px; font-size:18px; font-weight:650; font-stretch:105%;
                   color:#fff; transition:opacity .2s, transform .12s, filter .2s; animation:pop .3s var(--ease) both; }
    .btns button:active { transform:scale(.97); }
    .btns button:disabled { opacity:.5; }
    .go { background:var(--go); } .stop { background:var(--stop); } .pause { background:var(--pause); }
    @keyframes pop { from { opacity:0; transform:translateY(4px) scale(.98); } to { opacity:1; transform:none; } }
    .msg { font-size:13px; color:var(--pause); margin-top:8px; min-height:0; text-align:center; }
    .msg:empty { display:none; }

    /* ---------- Ligne du jour ---------- */
    .today { margin-top:14px; padding:10px 0 0; border-top:1px solid var(--line); }
    .today .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .today .cells { display:grid; grid-template-columns:repeat(3,1fr); }
    .today .cells div { font-size:12px; color:var(--muted); }
    .today .cells b { display:block; font-size:17px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

    /* ---------- Totaux ---------- */
    .totals { display:grid; grid-template-columns:repeat(3,1fr); margin-top:16px; background:var(--soft); border-radius:16px; padding:12px 0; }
    .totals div { text-align:center; }
    .totals div + div { border-left:1px solid var(--line); }
    .totals b { display:block; font-size:21px; font-weight:650; font-stretch:108%; font-variant-numeric:tabular-nums; }
    .totals span { font-size:12px; color:var(--muted); }
    .counts { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin-top:10px; font-size:13px; color:var(--muted); }
    .counts span { display:inline-flex; align-items:center; gap:6px; }
    .counts i { width:10px; height:10px; border-radius:3px; display:inline-block; }

    /* ---------- Modifier une journée ---------- */
    .editbtn { display:block; margin:14px auto 0; border:0; background:none; color:var(--ink); font-size:14px; font-weight:600;
               padding:8px 12px; border-radius:999px; transition:background .2s, opacity .3s; }
    .editbtn:hover { background:var(--soft); }
    .edit .inner > form { margin-top:12px; background:var(--soft); border-radius:18px; padding:16px; }
    .edit h3 { margin:0 0 12px; font-size:16px; font-weight:650; }
    .edit label { margin:12px 0 6px; }
    .types-main { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .types-main button { border:2px solid transparent; border-radius:14px; padding:14px 8px; font-size:15px; font-weight:650;
                         background:var(--surface); color:var(--ink); transition:border-color .2s, transform .12s, background .25s; }
    .types-main button:active, .types-more button:active { transform:scale(.97); }
    .types-more { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .types-more small { font-size:12px; color:var(--muted); }
    .types-more button { border:1.5px solid transparent; border-radius:999px; padding:6px 11px; font-size:13px; font-weight:600;
                         color:#1f2328; transition:border-color .2s, transform .12s; }
    /* Type sélectionné : contour épais, pastille ✓, léger grossissement ; les autres s'estompent */
    .types-main button, .types-more button { position:relative; transition:border-color .2s, transform .2s var(--ease), opacity .25s, filter .25s, box-shadow .2s; }
    .types-main button:not(.on), .types-more button:not(.on) { opacity:.5; filter:saturate(.6); }
    .types-main button:not(.on):hover, .types-more button:not(.on):hover { opacity:.8; }
    .types-main button.on, .types-more button.on { border-color:var(--ink); box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--ink);
                                                   transform:scale(1.03); animation:choose .35s var(--ease); }
    .types-main button.on::after, .types-more button.on::after {
      content:'✓'; position:absolute; top:-8px; right:-8px; width:22px; height:22px; border-radius:50%;
      background:var(--ink); color:var(--surface); font-size:13px; font-weight:800; line-height:22px; text-align:center;
      box-shadow:0 0 0 2px var(--surface); animation:badge .3s var(--ease) both; }
    .types-more button.on::after { width:18px; height:18px; line-height:18px; font-size:11px; top:-7px; right:-7px; }
    .types-more { padding-top:4px; }
    @keyframes choose { 0% { transform:scale(.96); } 60% { transform:scale(1.06); } 100% { transform:scale(1.03); } }
    @keyframes badge { from { transform:scale(0); } to { transform:scale(1); } }
    .chosen { font-size:13px; margin-top:10px; color:var(--ink); font-weight:600; min-height:18px; }
    .chosen i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; border:1px solid var(--line); }
    .f3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .f3 > div { min-width:0; }
    .f3 input { padding:11px 4px; text-align:center; }
    .hint { font-size:12px; color:var(--muted); margin-top:10px; }
    .hint.err { color:var(--stop); }
    .btns.small { margin-top:14px; }
    .btns.small button { padding:13px 8px; font-size:16px; animation:none; }
    .btns .ghost { background:var(--surface); color:var(--ink); }

    .foot { display:flex; justify-content:center; margin-top:16px; }
    .foot a { color:var(--muted); font-size:13px; }

    /* ---------- Réglages ---------- */
    .setup h1 { font-size:22px; font-stretch:110%; margin:4px 0 6px; }
    .setup p { font-size:14px; color:var(--muted); line-height:1.5; margin:0 0 6px; }
    .setup label { margin-top:14px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation:none !important; transition:none !important; }
    }
  </style>
</head>
<body>
  <main class="card" id="main" data-state="idle">
    <div class="top">
      <h1 class="brand">⏱ Pointeuse</h1>
      <span class="sync" id="sync" aria-live="polite"></span>
      <button class="icon" id="setupBtn" type="button" aria-label="Réglages">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

    <div style="display:grid">
      <!-- Squelette affiché pendant le premier chargement -->
      <div class="skel" id="skel" aria-hidden="true" style="grid-area:1/1">
        <div class="sk sk-status"></div>
        <div class="sk sk-timer"></div>
        <div class="sk sk-input"></div>
        <div class="sk sk-chips"></div>
        <div class="sk sk-btns"></div>
        <div class="sk sk-strip"></div>
        <div class="skel-msg" id="skelMsg"></div>
      </div>

      <div class="app" id="app" style="grid-area:1/1">
        <div class="stage">
          <div class="clock shown" id="clock">
            <div class="status" id="status"></div>
            <div class="timer" id="timer">00:00:00</div>
          </div>
          <div class="dayoff off" id="dayoff" aria-live="polite">
            <div class="emo" id="offEmo"></div>
            <h2 id="offTitle"></h2>
            <p id="offDate"></p>
            <button class="work" id="offWork" type="button">Je travaille quand même</button>
          </div>
        </div>

        <div class="collapse" id="workBox">
          <div class="inner">
            <label for="lieu">Lieu / événement</label>
            <input id="lieu" placeholder="Tape les premières lettres…" autocomplete="off" autocapitalize="sentences">
            <div class="chips" id="chips"></div>
            <div class="btns" id="btns"></div>
            <div class="msg" id="msg"></div>
            <div class="today" id="row" hidden></div>
          </div>
        </div>

        <div class="totals">
          <div><b id="d">–</b><span>Journée</span></div>
          <div><b id="w">–</b><span>Semaine</span></div>
          <div><b id="m">–</b><span>Mois</span></div>
        </div>
        <div class="counts" id="conges"></div>

        <button class="editbtn" id="editBtn" type="button">✏️ Modifier une journée</button>
        <div class="collapse edit closed" id="editWrap">
          <div class="inner">
            <form id="edit">
              <h3>Modifier une journée</h3>
              <label for="eDate">Date</label>
              <input type="date" id="eDate" required>
              <label>Type de journée</label>
              <div class="types-main" id="eTypesMain"></div>
              <div class="types-more" id="eTypesMore"><small>Autre :</small></div>
              <div class="collapse closed" id="eFinBox">
                <div class="inner">
                  <label for="eFin">Jusqu'au (inclus)</label>
                  <input type="date" id="eFin">
                </div>
              </div>
              <label for="eLieu">Lieu / événement</label>
              <input id="eLieu" autocomplete="off" autocapitalize="sentences">
              <div class="collapse" id="eTimes">
                <div class="inner">
                  <div class="f3" style="margin-top:12px">
                    <div><label for="eD" style="margin-top:0">Arrivée</label><input type="time" id="eD"></div>
                    <div><label for="eE" style="margin-top:0">Départ</label><input type="time" id="eE"></div>
                    <div><label for="eF" style="margin-top:0">Pause</label><input type="time" id="eF"></div>
                  </div>
                </div>
              </div>
              <div class="hint" id="eHint"></div>
              <div class="btns small">
                <button type="button" class="ghost" id="eCancel">Annuler</button>
                <button type="submit" class="go" id="eSave">Enregistrer</button>
              </div>
            </form>
          </div>
        </div>

        <div class="foot"><a id="link" href="#" target="_blank" rel="noopener">Ouvrir l'onglet pointage</a></div>
      </div>
    </div>
  </main>

  <!-- Écran de connexion (première ouverture ou bouton Réglages) -->
  <div class="card setup" id="setup" hidden>
    <h1 class="brand">⏱ Pointeuse</h1>
    <p>Ces infos restent enregistrées sur cette appareil uniquement.</p>
    <form id="setupForm">
      <label for="sUrl">Adresse du script</label>
      <input id="sUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label for="sTok">Code secret</label>
      <input id="sTok" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <div class="hint" id="sHint"></div>
      <div class="btns small">
        <button type="button" class="ghost" id="sCancel" hidden>Annuler</button>
        <button type="submit" class="go" id="sSave">Se connecter</button>
      </div>
    </form>
  </div>

<script>
  // ---------- Connexion au script (remplace google.script.run) ----------
  const CFG_KEY = 'pointeuse-cfg';
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { cfg = null; }
  // Lien de configuration possible : index.html#url=…&code=…
  (function () {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('url') && h.get('code')) {
      cfg = { url: h.get('url').trim(), token: h.get('code').trim() };
      try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
      history.replaceState(null, '', location.pathname + location.search);
    }
  })();

  function callApi(fn, args, conf) {
    conf = conf || cfg;
    if (!conf || !conf.url) return Promise.reject(new Error('Appli pas encore configurée.'));
    return fetch(conf.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // évite la vérification CORS préalable
      body: JSON.stringify({ token: conf.token, fn, args }),
      redirect: 'follow'
    }).catch(() => { throw new Error('Pas de connexion internet (ou adresse du script incorrecte).'); })
      .then(r => { if (!r.ok) throw new Error('Le script ne répond pas (erreur ' + r.status + ').');
                   return r.json().catch(() => { throw new Error('Réponse inattendue : vérifie l\'adresse et l\'accès « Tout le monde » du déploiement.'); }); })
      .then(j => { if (!j.ok) { const e = new Error(j.error || 'Erreur inconnue'); e.code = j.code; throw e; } return j.data; });
  }

  // Même syntaxe qu'avant : google.script.run.withSuccessHandler(f).withFailureHandler(g).fonction(args)
  window.google = { script: { get run() {
    let ok = () => {}, ko = () => {};
    const p = new Proxy({}, { get(_, name) {
      if (name === 'withSuccessHandler') return f => { ok = f; return p; };
      if (name === 'withFailureHandler') return f => { ko = f; return p; };
      return (...args) => { callApi(name, args).then(ok, e => { if (e.code === 'token') showSetup('Code secret incorrect.'); ko(e); }); };
    } });
    return p;
  } } };
</script>

<script>
  let state = null, loadedAt = 0, pending = 0;
  const $ = id => document.getElementById(id);
  const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const fmtM = m => { const t = Math.round(m); return Math.floor(t / 60) + 'h' + String(t % 60).padStart(2, '0'); };
  const fmtS = sec => { const s = Math.max(0, Math.floor(sec));
    return [s / 3600, (s % 3600) / 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); };
  const roundNow = () => { const a = (state && state.arrondi) || 5, d = new Date();
    const m = Math.round((d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60) / a) * a;
    return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const dateLongue = key => { const [y, m, d] = key.split('-').map(Number);
    const s = new Date(y, m - 1, d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1); };
  const setCollapsed = (el, closed) => el.classList.toggle('closed', closed);

  // Types de journée non travaillée : mêmes couleurs que dans le tableur
  const TYPES = {
    cp:    { nom: 'Congé payé', emoji: '🌴', color: '#f4cccc', ink: '#5e2424' },
    off:   { nom: 'Jour off',   emoji: '😴', color: '#d9d9d9', ink: '#2f3337' },
    ferie: { nom: 'Férié',      emoji: '🎉', color: '#c9daf8', ink: '#1f3a66' }
  };
  const titre = k => TYPES[k].emoji + ' ' + TYPES[k].nom;

  const BUTTONS = {
    idle:    [['start', 'Arrivée', 'go']],
    working: [['pause', 'Pause', 'pause'], ['end', 'Départ', 'stop']],
    paused:  [['resume', 'Reprendre', 'go'], ['end', 'Départ', 'stop']]
  };

  function flash(t, ms) {
    $('sync').textContent = t; $('sync').classList.toggle('on', !!t);
    if (ms) setTimeout(() => { if (!pending) $('sync').classList.remove('on'); }, ms);
  }

  // ---------- Suggestions de lieux ----------
  function renderChips() {
    if (!state) return;
    const q = norm($('lieu').value);
    let list = state.lieux;
    if (q) {
      const words = q.split(/\s+/);
      list = list.filter(l => { const n = norm(l.nom); return n !== q && words.every(w => n.includes(w)); })
                 .sort((a, b) => (norm(b.nom).startsWith(q) - norm(a.nom).startsWith(q)) || b.n - a.n);
    } else {
      // champ vide : les 3 plus récents + les plus fréquents
      const recent = [...state.lieux].sort((a, b) => b.last - a.last).slice(0, 3);
      list = [...recent, ...state.lieux.filter(l => !recent.includes(l))];
    }
    const sig = list.slice(0, 6).map(l => l.nom + l.n).join('|');
    if ($('chips').dataset.sig === sig) return;              // rien n'a changé : pas de clignotement
    $('chips').dataset.sig = sig;
    $('chips').innerHTML = '';
    list.slice(0, 6).forEach((l, i) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button';
      b.style.animationDelay = (i * 25) + 'ms';
      b.append(l.nom);
      if (l.n > 1) { const s = document.createElement('small'); s.textContent = '×' + l.n; b.append(s); }
      b.onclick = () => { $('lieu').value = l.nom; renderChips(); lieuChanged(); };
      $('chips').appendChild(b);
    });
  }
  $('lieu').addEventListener('input', renderChips);
  $('lieu').addEventListener('change', lieuChanged);
  function lieuChanged() {
    if (state && state.state !== 'idle' && $('lieu').value.trim() && $('lieu').value.trim() !== (state.row && state.row.lieu))
      run('lieu');
  }

  // ---------- Affichage ----------
  function render(s) {
    state = s; loadedAt = Date.now();
    const r = s.row;
    const T = s.state === 'idle' && r && TYPES[r.absence] ? TYPES[r.absence] : null;   // aujourd'hui = jour non travaillé
    $('main').dataset.state = s.state;
    $('main').classList.add('ready');

    // Scène : chrono ou carte du jour non travaillé
    $('clock').classList.toggle('off', !!T); $('clock').classList.toggle('shown', !T);
    $('dayoff').classList.toggle('off', !T); $('dayoff').classList.toggle('shown', !!T);
    setCollapsed($('workBox'), !!T);
    if (T) {
      $('dayoff').style.setProperty('--gel', T.color);
      $('dayoff').style.setProperty('--gel-ink', T.ink);
      $('offEmo').textContent = T.emoji;
      $('offTitle').textContent = T.nom;
      $('offDate').textContent = dateLongue(r.key);
      $('offWork').disabled = pending > 0;
    }

    // Boutons : on ne les recrée que si l'état change (l'animation n'a lieu qu'à ce moment-là)
    if ($('btns').dataset.state !== s.state || $('btns').dataset.pending !== String(pending > 0)) {
      $('btns').dataset.state = s.state; $('btns').dataset.pending = String(pending > 0);
      $('btns').innerHTML = '';
      BUTTONS[s.state].forEach(([act, label, cls]) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = label; b.className = cls; b.onclick = () => run(act);
        b.disabled = pending > 0;
        $('btns').appendChild(b);
      });
    }

    $('status').textContent = s.state === 'working' ? 'Au travail depuis ' + r.arrivee
      : s.state === 'paused' ? 'En pause' : (r && TYPES[r.absence]) ? titre(r.absence) : 'Pas de session en cours';
    const a = s.absences || {}, nb = k => (a[k] || { mois: 0, annee: 0 });
    $('conges').textContent = '🌴 cp : ' + nb('cp').annee + ' jours cette année · 😴 Off : ' + nb('off').mois + ' jours ce mois'
      + (nb('ferie').mois ? ' · 🎉 Férié : ' + nb('ferie').mois + ' j' : '');
    $('timer').classList.toggle('paused', s.state === 'paused');

    if (document.activeElement !== $('lieu') && s.state !== 'idle' && r && r.lieu) $('lieu').value = r.lieu;

    if (r && !T) {
      $('row').hidden = false;
      $('row').innerHTML = '<div class="meta"></div><div class="cells">'
        + '<div>Arrivée<b></b></div><div>Départ<b></b></div><div>Pause<b></b></div></div>';
      $('row').querySelector('.meta').textContent = r.date + ' — ligne ' + r.line + ' du tableur';
      const b = $('row').querySelectorAll('b');
      b[0].textContent = r.arrivee || '–'; b[1].textContent = r.depart || '–'; b[2].textContent = r.pause || '–';
    } else $('row').hidden = true;

    $('msg').textContent = s.msg || '';
    $('link').href = s.url || '#';
    renderChips();
    tick();
  }

  function tick() {
    if (!state) return;
    const extra = state.state === 'working' ? (Date.now() - loadedAt) / 1000 : 0;
    $('timer').textContent = fmtS(state.workedSec + extra);
    $('d').textContent = fmtM(state.totals.day + extra / 60);
    $('w').textContent = fmtM(state.totals.week + extra / 60);
    $('m').textContent = fmtM(state.totals.month + extra / 60);
  }

  // Mise à jour immédiate de l'écran, avant la réponse du serveur
  function predict(act) {
    const s = JSON.parse(JSON.stringify(state));
    const extra = s.state === 'working' ? (Date.now() - loadedAt) / 1000 : 0;
    s.workedSec += extra; ['day', 'week', 'month'].forEach(k => s.totals[k] += extra / 60);
    s.msg = '';
    const lieu = $('lieu').value.trim();
    if (act === 'start') {
      s.state = 'working';
      if (!s.row || !s.row.arrivee) { s.row = Object.assign(s.row || { line: '…', date: new Date().toLocaleDateString('fr-FR') }, { arrivee: roundNow(), depart: '', pause: '00:00', absence: '' }); s.workedSec = 0; }
      else s.row.depart = '';
    }
    if (act === 'pause') s.state = 'paused';
    if (act === 'resume') s.state = 'working';
    if (act === 'end') { s.state = 'idle'; if (s.row) s.row.depart = roundNow(); s.workedSec = 0; }
    if (lieu && s.row) s.row.lieu = lieu;
    return s;
  }

  function run(act) {
    if (!state || pending) return;
    const before = state;
    pending++;
    if (act !== 'lieu') render(predict(act));
    flash('Enregistrement…');
    google.script.run
      .withSuccessHandler(s => { pending--; render(s); flash('✓ Enregistré', 1500); })
      .withFailureHandler(e => { pending--; flash(''); render(before); alert('Erreur, rien n\'a été enregistré : ' + e.message); })
      .action(act, $('lieu').value);
  }
  $('offWork').onclick = () => run('start');

  // ---------- Modification manuelle ----------
  let editReq = 0;
  const localToday = () => { const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function hint(t, err) { $('eHint').textContent = t || ''; $('eHint').classList.toggle('err', !!err); }

  function fillEdit(r) {
    $('eLieu').value = r.lieu || '';
    $('eD').value = r.arrivee || '';
    $('eE').value = r.depart || '';
    $('eF').value = r.pause || '';
    eType = r.absence || '';
    savedTimes = null;
    $('eFin').value = $('eDate').value;
    let t = r.line ? 'Ligne ' + r.line + ' du tableur.' : 'Pas encore de ligne pour cette date : elle sera créée.';
    if (r.pauseEnCours) t += ' Pause en cours (elle s\'arrête si tu mets un départ).';
    editInfo = t;
    typeUI();
  }

  let editInfo = '', eType = '';
  // Choisir un type non travaillé met les heures de côté (le serveur avertit avant de les effacer) ; revenir à « Travail » les remet
  let savedTimes = null;
  function setType(k) {
    if (k && !eType) {
      savedTimes = [$('eD').value, $('eE').value, $('eF').value];
      $('eD').value = ''; $('eE').value = ''; $('eF').value = '';
    } else if (!k && eType && savedTimes) {
      [$('eD').value, $('eE').value, $('eF').value] = savedTimes; savedTimes = null;
    }
    eType = k; typeUI();
  }
  function typeUI() {
    const on = !!eType;
    document.querySelectorAll('[data-type]').forEach(b => {
      const on = b.dataset.type === eType;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
    const ch = $('eChosen'); ch.textContent = '';
    const dot = document.createElement('i'); dot.style.background = eType ? TYPES[eType].color : 'var(--surface)';
    ch.append(dot, 'Sélectionné : ' + (eType ? TYPES[eType].nom : 'Travail'));
    setCollapsed($('eTimes'), on);
    setCollapsed($('eFinBox'), !on);
    $('eFin').min = $('eDate').value;
    if (!$('eFin').value || $('eFin').value < $('eDate').value) $('eFin').value = $('eDate').value;
    hint(editInfo + (on ? ' La ligne sera colorée comme dans le tableur, sans heures.'
                        : ' Pause vide = 00:00. Départ vide = journée en cours.'));
  }
  // Mis en avant : Travail et Jour off. En option, plus petit : Congé payé et Férié
  function typeBtn(k, label, color) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.type = k;
    if (color) { b.style.background = color; b.style.color = '#1f2328'; }
    b.onclick = () => setType(k);
    return b;
  }
  $('eTypesMain').append(typeBtn('', '🛠 Travail', ''), typeBtn('off', titre('off'), TYPES.off.color));
  $('eTypesMore').append(typeBtn('cp', titre('cp'), TYPES.cp.color), typeBtn('ferie', titre('ferie'), TYPES.ferie.color));

  function loadEdit(key) {
    const id = ++editReq;
    hint('Chargement…'); $('eSave').disabled = true;
    google.script.run
      .withSuccessHandler(r => { if (id !== editReq) return; $('eSave').disabled = false; fillEdit(r); })
      .withFailureHandler(e => { if (id !== editReq) return; hint('Erreur : ' + e.message, true); })
      .getRow(key);
  }

  function openEdit() {
    if (!state) return;
    const key = (state.row && state.row.key) || state.today || localToday();
    $('eDate').value = key;
    setCollapsed($('editWrap'), false);
    $('editBtn').hidden = true;
    if (state.row && state.row.key === key) { $('eSave').disabled = false; fillEdit(state.row); }
    else loadEdit(key);
    setTimeout(() => $('editWrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
  }
  function closeEdit() { editReq++; setCollapsed($('editWrap'), true); $('editBtn').hidden = false; hint(''); }

  $('editBtn').onclick = openEdit;
  $('eCancel').onclick = closeEdit;
  $('eDate').addEventListener('change', () => { if ($('eDate').value) loadEdit($('eDate').value); });
  function saveEdit(force) {
    if (pending) return;
    const key = $('eDate').value;
    if (!key) return hint('Choisis une date.', true);
    pending++; $('eSave').disabled = true; hint('Enregistrement…');
    google.script.run
      .withSuccessHandler(s => {
        pending--; $('eSave').disabled = false;
        if (s.confirm) {                                   // avertissement du serveur : rien n'a encore été modifié
          if (confirm(s.confirm)) saveEdit(true);
          else hint('Annulé : rien n\'a été modifié.');
          return;
        }
        savedTimes = null; closeEdit(); render(s); flash('✓ Modifié', 2000); })
      .withFailureHandler(e => { pending--; $('eSave').disabled = false; hint(e.message, true); })
      .edit(key, { lieu: $('eLieu').value, arrivee: $('eD').value, depart: $('eE').value, pause: $('eF').value,
                   absence: eType, fin: eType ? ($('eFin').value || key) : '',
                   force: !!force });
  }
  $('edit').addEventListener('submit', ev => { ev.preventDefault(); saveEdit(false); });

  function load() {
    if (pending) return;
    google.script.run.withSuccessHandler(s => { if (!pending) render(s); })
      .withFailureHandler(e => {
        if (state) flash('Erreur : ' + e.message, 4000);
        else $('skelMsg').textContent = 'Chargement impossible : ' + e.message;
      })
      .getStatus();
  }

  // ---------- Réglages ----------
  function showSetup(msg) {
    $('setup').hidden = false; $('main').hidden = true;
    $('sUrl').value = (cfg && cfg.url) || ''; $('sTok').value = (cfg && cfg.token) || '';
    $('sCancel').hidden = !(cfg && cfg.url);
    $('sHint').textContent = msg || ''; $('sHint').classList.toggle('err', !!msg);
  }
  function hideSetup() { $('setup').hidden = true; $('main').hidden = false; }
  $('setupBtn').onclick = () => showSetup();
  $('sCancel').onclick = hideSetup;
  $('setupForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const conf = { url: $('sUrl').value.trim(), token: $('sTok').value.trim() };
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(conf.url)) {
      $('sHint').textContent = 'L\'adresse doit commencer par https://script.google.com/ et finir par /exec.';
      $('sHint').classList.add('err'); return;
    }
    $('sSave').disabled = true; $('sHint').classList.remove('err'); $('sHint').textContent = 'Vérification…';
    callApi('getStatus', [], conf).then(s => {
      cfg = conf;
      try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
      $('sSave').disabled = false; hideSetup(); start(); render(s);
    }, e => { $('sSave').disabled = false; $('sHint').textContent = e.message; $('sHint').classList.add('err'); });
  });

  let started = false;
  function start() {
    if (started) return; started = true;
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    load();
  }

  if (cfg && cfg.url && cfg.token) start(); else showSetup();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
